<figure role="group" style="aspect-ratio:1920/1038; background:#1e1e2e; border-radius:5px; margin:1.5em 0;">
  <video autoplay loop muted playsinline aria-label="{{ .Get "alt" | default "Video" }}" style="width:100%; height:100%; border-radius:5px; display:block;">
    <source src="{{ .Get "src" }}" type="video/mp4">
    <p>{{ .Get "alt" | default "Your browser does not support the video tag." }}</p>
  </video>
</figure>
